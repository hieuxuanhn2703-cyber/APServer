{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu</title>
    <link rel="stylesheet" href="{% static 'working/css/login.css' %}">
</head>
<body>
    <div class="login-container">
        <h2>Đổi mật khẩu</h2>

        {% if error %}
            <div class="error-msg" style="color: red; margin-bottom: 10px; text-align: center;">{{ error }}</div>
        {% endif %}
        
        {% if success %}
            <div class="success-msg" style="color: green; margin-bottom: 10px; text-align: center;">Đổi mật khẩu thành công!</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="old_password">Mật khẩu cũ</label>
                <input type="password" id="old_password" name="old_password" required>
            </div>
            <div class="form-group">
                <label for="new_password">Mật khẩu mới</label>
                <input type="password" id="new_password" name="new_password" required>
            </div>
            <div class="form-group">
                <label for="confirm_password">Nhập lại mật khẩu mới</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>
            <button type="submit">Xác nhận</button>
            <div style="margin-top: 15px; text-align: center;">
                <a href="javascript:history.back()" style="color: #3498db; text-decoration: none;">&larr; Quay lại</a>
            </div>
        </form>
    </div>
</body>
</html>
