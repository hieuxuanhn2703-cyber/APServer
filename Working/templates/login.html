{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Đăng nhập hệ thống - An Phát</title>
    <link rel="icon" type="image/png" href="{% static 'working/images/logo_anphat.png' %}">
    <link rel="stylesheet" href="{% static 'working/css/premium.css' %}">
    <style>
        body {
            margin: 0;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            box-sizing: border-box;
        }
        .auth-wrapper {
            width: 100%;
            max-width: 400px;
            margin: auto;
        }
        .auth-card {
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 12px 36px rgba(15, 23, 42, 0.12), 0 2px 6px rgba(15, 23, 42, 0.04);
            padding: 28px 24px;
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-sizing: border-box;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .auth-logo-box {
            width: 64px;
            height: 64px;
            margin: 0 auto 12px;
            background: #ffffff;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.15);
            border: 1px solid #e2e8f0;
        }
        .auth-logo-box img {
            width: 46px;
            height: 46px;
            object-fit: contain;
        }
        .auth-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: #0f172a;
            margin: 0 0 4px;
            letter-spacing: -0.01em;
        }
        .auth-subtitle {
            font-size: 0.85rem;
            color: #64748b;
            margin: 0;
            font-weight: 500;
        }
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .auth-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: left;
        }
        .auth-field label {
            font-size: 0.88rem;
            font-weight: 700;
            color: #334155;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .input-group {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }
        .input-group input {
            width: 100%;
            height: 50px;
            padding: 0 42px 0 40px;
            font-size: 16px !important; /* 16px prevents iOS Safari zoom on focus */
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            background: #f8fafc;
            color: #0f172a;
            font-weight: 600;
            box-sizing: border-box;
            transition: all 0.2s ease;
            -webkit-appearance: none;
            appearance: none;
        }
        .input-group input:focus {
            outline: none;
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }
        .input-icon-left {
            position: absolute;
            left: 12px;
            color: #94a3b8;
            pointer-events: none;
            display: flex;
            align-items: center;
        }
        .toggle-pwd-btn {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            padding: 8px;
            color: #94a3b8;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            touch-action: manipulation;
        }
        .toggle-pwd-btn:active {
            color: #2563eb;
            background: #f1f5f9;
        }
        .btn-submit-auth {
            width: 100%;
            height: 50px;
            background: linear-gradient(135deg, #1e40af 0%, #2563eb 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
            transition: all 0.2s ease;
            margin-top: 6px;
            touch-action: manipulation;
        }
        .btn-submit-auth:active {
            transform: scale(0.98);
            background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 100%);
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
        }
        .auth-error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            text-align: left;
        }
        .auth-footer {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #f1f5f9;
            text-align: center;
        }
        .btn-register-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #2563eb;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.92rem;
            padding: 8px 12px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .btn-register-link:active {
            background: #eff6ff;
        }
    </style>
</head>
<body>
    <div class="auth-wrapper fade-in">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo-box">
                    <img src="{% static 'working/images/logo_anphat.png' %}" alt="An Phát Logo">
                </div>
                <h1 class="auth-title">Đăng Nhập Hệ Thống</h1>
                <p class="auth-subtitle">May Xuất Khẩu An Phát</p>
            </div>

            {% if error %}
            <div class="auth-error">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="post" class="auth-form">
                {% csrf_token %}
                <div class="auth-field">
                    <label for="account">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        Tên tài khoản
                    </label>
                    <div class="input-group">
                        <span class="input-icon-left">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </span>
                        <input type="text" id="account" name="account" placeholder="Nhập tài khoản của bạn" autocomplete="username" autocapitalize="none" autocorrect="off" required>
                    </div>
                </div>

                <div class="auth-field">
                    <label for="password">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        Mật khẩu
                    </label>
                    <div class="input-group">
                        <span class="input-icon-left">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                        <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" autocomplete="current-password" required>
                        <button type="button" class="toggle-pwd-btn" onclick="togglePasswordVisibility()" aria-label="Hiện/Ẩn mật khẩu" tabindex="-1">
                            <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-submit-auth">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                        <polyline points="10 17 15 12 10 7"></polyline>
                        <line x1="15" y1="12" x2="3" y2="12"></line>
                    </svg>
                    Đăng Nhập
                </button>

                <div class="auth-footer">
                    <a href="{% url 'register' %}" class="btn-register-link">
                        <span>Chưa có tài khoản?</span>
                        <span style="text-decoration: underline;">Đăng ký ngay</span>
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script>
        function togglePasswordVisibility() {
            var pwdInput = document.getElementById("password");
            var eyeIcon = document.getElementById("eye-icon");
            if (pwdInput.type === "password") {
                pwdInput.type = "text";
                eyeIcon.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                `;
            } else {
                pwdInput.type = "password";
                eyeIcon.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                `;
            }
        }
    </script>
</body>
</html>
