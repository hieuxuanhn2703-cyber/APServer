{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản</title>
    <link rel="stylesheet" href="{% static 'working/css/login.css' %}">
</head>
<body>
    <div class="login-container">
        <h2>Đăng ký tài khoản</h2>

        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}
        
        {% if success %}
            <div class="error-msg" style="background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb;">
                Đăng ký thành công! Tài khoản của bạn đang chờ phê duyệt.
            </div>
            <div style="margin-top: 15px; text-align: center;">
                <a href="{% url 'login' %}" style="color: #3498db; text-decoration: none;">Quay lại đăng nhập</a>
            </div>
        {% else %}
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="name">Họ tên</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="account">Tài khoản</label>
                    <input type="text" id="account" name="account" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" name="password" autocomplete="new-password" required>
                </div>
                <div class="form-group">
                    <label for="confirm_password">Nhập lại mật khẩu</label>
                    <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required>
                </div>
                <button type="submit">Đăng ký</button>
                <div style="margin-top: 15px; text-align: center;">
                    <a href="{% url 'login' %}" style="color: #3498db; text-decoration: none;">Đã có tài khoản? Đăng nhập</a>
                </div>
            </form>
        {% endif %}
    </div>
</body>
</html>
